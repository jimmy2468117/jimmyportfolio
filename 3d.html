<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工業設計作品集 - 3D 展示</title>
    <!-- Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; outline: none; }
        
        /* 隱藏滾動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 簡單的加載動畫 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    
    <!-- Three.js CDN (3D 引擎核心) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="text-white">

    <!-- UI 層：作品資訊 (你可以修改這裡的文字) -->
    <div class="absolute top-0 left-0 p-8 z-10 max-w-md pointer-events-none">
        <div class="pointer-events-auto bg-black/60 backdrop-blur-md p-6 rounded-xl border border-white/10 shadow-xl transition-all hover:bg-black/70">
            <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-500 text-xs font-bold px-2 py-0.5 rounded text-white">2024</span>
                <span class="text-gray-400 text-xs tracking-widest uppercase">Industrial Design</span>
            </div>
            <h1 class="text-3xl font-bold mb-2 tracking-tight">Sonic Flow - 無線音響</h1>
            <p class="text-gray-300 text-sm leading-relaxed mb-4">
                探索有機形態與極簡幾何的結合。Sonic Flow 旨在融入現代居家環境，採用陽極氧化鋁與聲學織物，提供 360 度沈浸式聽覺體驗。
            </p>
            
            <div class="space-y-2 border-t border-white/10 pt-4">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-400">軟體工具</span>
                    <span>Rhino, Keyshot, Blender</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-400">材質</span>
                    <span>鋁合金, Kvadrat 織布</span>
                </div>
            </div>
        </div>
    </div>

    <!-- UI 層：操作提示 -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-10 pointer-events-none">
        <div class="bg-black/40 backdrop-blur-sm px-4 py-2 rounded-full border border-white/5 text-xs text-gray-400 flex items-center gap-4">
            <span class="flex items-center gap-1"><span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span> 左鍵旋轉</span>
            <span>滾輪縮放</span>
            <span>右鍵平移</span>
        </div>
    </div>

    <!-- UI 層：切換材質按鈕 (互動範例) -->
    <div class="absolute right-8 top-1/2 transform -translate-y-1/2 z-10 flex flex-col gap-4 pointer-events-none">
        <div class="pointer-events-auto group relative">
            <button id="mat-silver" class="w-12 h-12 rounded-full bg-gray-300 border-2 border-transparent hover:border-white shadow-lg transition-transform hover:scale-110 focus:outline-none ring-2 ring-transparent focus:ring-blue-500" title="銀色鋁合金"></button>
            <span class="absolute right-14 top-1/2 -translate-y-1/2 bg-black/80 px-2 py-1 rounded text-xs opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">太空銀</span>
        </div>
        <div class="pointer-events-auto group relative">
            <button id="mat-dark" class="w-12 h-12 rounded-full bg-gray-800 border-2 border-transparent hover:border-white shadow-lg transition-transform hover:scale-110 focus:outline-none ring-2 ring-transparent focus:ring-blue-500" title="深空灰"></button>
            <span class="absolute right-14 top-1/2 -translate-y-1/2 bg-black/80 px-2 py-1 rounded text-xs opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">深空灰</span>
        </div>
        <div class="pointer-events-auto group relative">
            <button id="mat-gold" class="w-12 h-12 rounded-full bg-yellow-700 border-2 border-transparent hover:border-white shadow-lg transition-transform hover:scale-110 focus:outline-none ring-2 ring-transparent focus:ring-blue-500" title="香檳金"></button>
            <span class="absolute right-14 top-1/2 -translate-y-1/2 bg-black/80 px-2 py-1 rounded text-xs opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">香檳金</span>
        </div>
    </div>

    <!-- 載入中遮罩 -->
    <div id="loading-screen" class="absolute inset-0 bg-[#1a1a1a] z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loader mb-4"></div>
        <div class="text-sm tracking-widest text-gray-400">LOADING MODEL</div>
    </div>

    <!-- 3D 場景容器 -->
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // --- 1. 初始化場景 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a); 
        scene.fog = new THREE.Fog(0x1a1a1a, 10, 50);

        // 初始化相機
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4, 3, 5); 

        // 初始化渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. 燈光設置 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 2);
        keyLight.position.set(5, 5, 5);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xbadeff, 1);
        fillLight.position.set(-5, 0, 5);
        scene.add(fillLight);

        const rimLight = new THREE.SpotLight(0xffeeb1, 3);
        rimLight.position.set(0, 5, -5);
        rimLight.lookAt(0, 0, 0);
        scene.add(rimLight);

        // --- 3. 創建/載入模型 ---
        let currentModel = null;
        let mainMaterial = null;

        // ==========================================
        // 重要：要換成你自己的模型，請修改這裡 const useProceduralModel = true;
        // ==========================================
        const useProceduralModel = true; // 改成 false 就可以讀取外部檔案
        const modelPath = './my-model.glb'; // 你的模型檔案名稱
        // ==========================================

        const loadingScreen = document.getElementById('loading-screen');

        if (useProceduralModel) {
            // 生成範例圓柱體
            const group = new THREE.Group();
            
            // 主體
            const bodyGeo = new THREE.CylinderGeometry(1, 1, 3, 64);
            mainMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xcccccc, roughness: 0.2, metalness: 0.8 
            });
            const body = new THREE.Mesh(bodyGeo, mainMaterial);
            body.castShadow = true; body.receiveShadow = true;
            body.position.y = 1.5;
            group.add(body);

            // 網罩
            const grillGeo = new THREE.CylinderGeometry(1.01, 1.01, 1.2, 64);
            const grillMat = new THREE.MeshStandardMaterial({ 
                color: 0x333333, roughness: 0.9 
            });
            const grill = new THREE.Mesh(grillGeo, grillMat);
            grill.position.y = 0.6;
            group.add(grill);

            // 頂蓋
            const topGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.1, 32);
            const topMat = new THREE.MeshPhysicalMaterial({
                color: 0x111111, roughness: 0.1, clearcoat: 1.0
            });
            const topPart = new THREE.Mesh(topGeo, topMat);
            topPart.position.y = 3.01;
            group.add(topPart);

            scene.add(group);
            currentModel = body; 

            // 關閉 Loading
            setTimeout(() => {
                loadingScreen.style.opacity = 0;
                setTimeout(() => loadingScreen.style.display = 'none', 500);
            }, 800);

        } else {
            // 載入外部 GLB
            const loader = new GLTFLoader();
            loader.load(modelPath, (gltf) => {
                const model = gltf.scene;
                
                // 自動置中與貼地
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);
                model.position.y += size.y / 2;

                scene.add(model);
                
                // 嘗試抓取材質 (你可以修改這裡來抓取特定部件)
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        // mainMaterial = child.material; 
                    }
                });

                loadingScreen.style.opacity = 0;
                setTimeout(() => loadingScreen.style.display = 'none', 500);
            }, undefined, (error) => {
                console.error(error);
                loadingScreen.innerHTML = '<div class="text-red-500">找不到模型檔案<br>請確認路徑</div>';
            });
        }

        // --- 4. 地板 ---
        const planeGeometry = new THREE.PlaneGeometry(100, 100);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);
        
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // --- 5. 控制器與互動 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;
        controls.maxDistance = 10;
        controls.maxPolarAngle = Math.PI / 2;

        // 按鈕切換顏色
        document.getElementById('mat-silver').addEventListener('click', () => {
            if(mainMaterial) { mainMaterial.color.setHex(0xcccccc); mainMaterial.roughness = 0.2; mainMaterial.metalness = 0.8; }
        });
        document.getElementById('mat-dark').addEventListener('click', () => {
            if(mainMaterial) { mainMaterial.color.setHex(0x222222); mainMaterial.roughness = 0.5; mainMaterial.metalness = 0.5; }
        });
        document.getElementById('mat-gold').addEventListener('click', () => {
            if(mainMaterial) { mainMaterial.color.setHex(0xd4af37); mainMaterial.roughness = 0.3; mainMaterial.metalness = 1.0; }
        });

        // --- 6. 渲染循環 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
